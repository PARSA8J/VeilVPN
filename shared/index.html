<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Veil — See nothing. Be invisible.</title>
<meta name="description" content="Mehrveil — Fast, secure, private. See nothing. Be invisible.">
<style>
  *{margin:0;padding:0;box-sizing:border-box}

  :root{
    --accent:#0a84ff;
    --accent-2:#8b5cf6;
    --accent-3:#ec4899;
    --success:#10b981;
    --warn:#f59e0b;
    --ink:#23262e;
    --ink-soft:rgba(35,38,46,0.62);
    --ink-faint:rgba(35,38,46,0.40);
    --glass-bg:rgba(255,255,255,0.58);
    --glass-brd:rgba(255,255,255,0.75);
  }

  html,body{height:100%}

  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at center, #f5f5f7, #e2e2e8);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:clamp(12px,2.5vh,20px) clamp(12px,4vw,18px) clamp(20px,4vh,32px);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* ============================================================
     BACKGROUND — soft pastel liquid glass
     ============================================================ */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bg-gradient{
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 12% 10%, rgba(199,210,254,0.55) 0%, transparent 42%),
      radial-gradient(circle at 88% 16%, rgba(165,243,252,0.50) 0%, transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(251,207,232,0.45) 0%, transparent 48%),
      radial-gradient(circle at 78% 62%, rgba(254,240,199,0.35) 0%, transparent 40%),
      radial-gradient(circle at center, #f5f5f7, #e2e2e8);
  }
  .orb{
    position:absolute;border-radius:50%;
    filter:blur(80px);opacity:.42;will-change:transform;
  }
  .orb1{width:340px;height:340px;top:-100px;left:-80px;
    background:radial-gradient(circle,#c7d2fe,transparent 70%);
    animation:float1 18s ease-in-out infinite}
  .orb2{width:300px;height:300px;bottom:-90px;right:-70px;
    background:radial-gradient(circle,#a5f3fc,transparent 70%);
    animation:float2 22s ease-in-out infinite}
  .orb3{width:260px;height:260px;top:45%;left:55%;
    background:radial-gradient(circle,#fbcfe8,transparent 70%);
    opacity:.38;animation:float3 26s ease-in-out infinite}
  .bg-noise{
    position:absolute;inset:0;opacity:.025;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  @keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,70px) scale(1.15)}}
  @keyframes float2{0%,100%{transform:translate(0,0) scale(1.05)}50%{transform:translate(-60px,-40px) scale(.92)}}
  @keyframes float3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-40%,-60%) scale(1.2)}}

  /* ============================================================
     GLASS — the liquid glass recipe:
     white base + backdrop blur + white inset highlights + soft shadow
     ============================================================ */
  .glass{
    position:relative;
    background:var(--glass-bg);
    backdrop-filter:blur(20px) saturate(170%);
    -webkit-backdrop-filter:blur(20px) saturate(170%);
    border:1px solid var(--glass-brd);
    border-radius:20px;
    box-shadow:
      inset 2px -2px 1px -1px rgba(255,255,255,0.9),
      inset -2px 2px 1px -1px rgba(255,255,255,0.9),
      inset 6px -6px 1px -6px rgba(255,255,255,0.55),
      inset -6px 6px 1px -6px rgba(255,255,255,0.55),
      inset 0 0 2px rgba(0,0,0,0.06),
      0 4px 8px rgba(0,0,0,0.08),
      0 12px 32px rgba(31,38,58,0.10);
  }
  /* v1.6.11 — deeper Liquid Glass (user-reference component recipe):
     blurred inner dark ring + 45° specular gloss overlay, layered
     BEHIND content so text stays crisp */
  .glass::before{
    content:'';position:absolute;z-index:0;
    top:22%;left:50%;transform:translateX(-50%);
    width:calc(100% - 16px);height:calc(100% - 16px);
    border-radius:inherit;
    border:1px solid rgba(35,38,46,0.9);
    filter:blur(10px);opacity:.10;pointer-events:none;
  }
  .glass::after{
    content:'';position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(45deg,
      rgba(255,255,255,0.85) 0%,
      transparent var(--tr,22%),
      transparent calc(100% - var(--tr,22%)),
      rgba(255,255,255,0.85) 100%);
    filter:blur(7px);opacity:.55;
  }
  .glass > *{position:relative;z-index:1}

  /* ============================================================
     APP LAYOUT
     ============================================================ */
  .app{
    position:relative;z-index:1;
    width:100%;max-width:min(400px,100%);
    margin:auto; /* vertical centering that never clips when content is taller */
    display:flex;flex-direction:column;gap:clamp(10px,1.8vh,14px);
  }
  .app > *{animation:rise .7s cubic-bezier(.22,1,.36,1) backwards}
  .app > *:nth-child(1){animation-delay:.02s}
  .app > *:nth-child(2){animation-delay:.08s}
  .app > *:nth-child(3){animation-delay:.14s}
  .app > *:nth-child(4){animation-delay:.20s}
  .app > *:nth-child(5){animation-delay:.26s}

  @keyframes rise{
    from{opacity:0;transform:translateY(18px) scale(.98)}
    to{opacity:1;transform:none}
  }

  /* ============================================================
     HEADER
     ============================================================ */
  .header{
    display:flex;align-items:center;justify-content:space-between;
    padding:2px 4px;
  }
  .brand{
    display:flex;align-items:center;gap:10px;
    font-weight:800;font-size:17px;letter-spacing:-.04em;
    background:linear-gradient(120deg,#23262e 30%,#3b82f6 75%,#0a84ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-icon{
    width:34px;height:34px;border-radius:11px;
    display:grid;place-items:center;
    background:linear-gradient(145deg,rgba(255,255,255,0.95),rgba(226,232,240,0.75));
    border:1px solid rgba(255,255,255,0.9);
    box-shadow:
      inset 2px -2px 1px -1px rgba(255,255,255,0.95),
      inset -2px 2px 1px -1px rgba(255,255,255,0.95),
      0 4px 10px rgba(31,38,58,0.14);
    color:var(--ink);
    position:relative;
    overflow:hidden;
  }
  .brand-icon::before{
    content:'';
    position:absolute;inset:0;
    background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),transparent 55%);
    pointer-events:none;
  }
  .brand-icon svg{width:19px;height:19px;position:relative;z-index:1}

  .status-pill{
    display:flex;align-items:center;gap:7px;
    padding:7px 13px;border-radius:999px;
    font-size:11.5px;font-weight:500;
    background:rgba(255,255,255,.6);
    border:1px solid rgba(255,255,255,.85);
    backdrop-filter:blur(12px) saturate(160%);
    -webkit-backdrop-filter:blur(12px) saturate(160%);
    color:var(--ink-soft);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 6px rgba(31,38,58,0.08);
    transition:all .5s ease;
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:#94a3b8;
    transition:all .5s ease;
  }
  .status-pill.connected{
    background:rgba(16,185,129,.14);
    border-color:rgba(16,185,129,.35);
    color:#065f46;
  }
  .status-pill.connected .status-dot{
    background:var(--success);
    box-shadow:0 0 10px var(--success);
    animation:dotPulse 2s ease-in-out infinite;
  }
  .status-pill.connecting{
    background:rgba(245,158,11,.15);
    border-color:rgba(245,158,11,.38);
    color:#92400e;
  }
  .status-pill.connecting .status-dot{
    background:var(--warn);
    box-shadow:0 0 10px var(--warn);
    animation:dotPulse 1s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{transform:scale(1);opacity:1}
    50%{transform:scale(1.35);opacity:.7}
  }

  /* ============================================================
     CONNECT ZONE
     ============================================================ */
  .connect-zone{
    display:flex;flex-direction:column;align-items:center;
    padding:16px 0 4px;gap:16px;
  }

  .connect-wrap{
    position:relative;
    width:clamp(126px,36vmin,158px);height:clamp(126px,36vmin,158px);
    display:grid;place-items:center;
    /* fx-layer: alpha-contrast makes the specular overlaps read as real glass */
    filter:saturate(118%) contrast(1.16);
  }

  .ring{
    position:absolute;border-radius:50%;
    border:1px solid rgba(10,132,255,.45);
    opacity:0;pointer-events:none;inset:0;
  }
  .connected .ring1{animation:ringPulse 3s cubic-bezier(.22,1,.36,1) infinite}
  .connected .ring2{animation:ringPulse 3s cubic-bezier(.22,1,.36,1) infinite;animation-delay:1s}
  .connected .ring3{animation:ringPulse 3s cubic-bezier(.22,1,.36,1) infinite;animation-delay:2s}

  @keyframes ringPulse{
    0%{transform:scale(.75);opacity:0}
    20%{opacity:.7}
    100%{transform:scale(1.5);opacity:0}
  }

  .connect-btn{
    position:relative;
    width:clamp(112px,32vmin,140px);height:clamp(112px,32vmin,140px);border-radius:50%;
    display:grid;place-items:center;
    cursor:pointer;
    color:var(--ink-faint);
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(18px) saturate(170%);
    -webkit-backdrop-filter:blur(18px) saturate(170%);
    border:1px solid rgba(255,255,255,.85);
    box-shadow:
      inset 2px -2px 1px -1px rgba(255,255,255,0.95),
      inset -2px 2px 1px -1px rgba(255,255,255,0.95),
      inset 6px -6px 1px -6px rgba(255,255,255,0.6),
      inset -6px 6px 1px -6px rgba(255,255,255,0.6),
      inset 0 0 2px rgba(0,0,0,0.10),
      0 4px 8px rgba(0,0,0,0.10),
      0 14px 34px rgba(31,38,58,0.12);
    transition:
      transform .4s cubic-bezier(.34,1.56,.64,1),
      color .5s ease,background .6s ease,
      border-color .5s ease,box-shadow .6s ease;
    -webkit-tap-highlight-color:transparent;
    z-index:2;
  }
  .connect-btn::before{
    content:'';position:absolute;inset:5px;border-radius:50%;
    border:1px solid rgba(35,38,46,0.10);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.30);
    filter:blur(6px);
    pointer-events:none;
  }
  .connect-btn::after{
    content:'';position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(45deg,
      rgba(255,255,255,0.9) 0%,
      transparent 22%,
      transparent 78%,
      rgba(255,255,255,0.9) 100%);
    filter:blur(6px);
    pointer-events:none;
  }
  .connect-btn:hover{transform:scale(1.04) translateY(-2px)}
  .connect-btn:active{transform:scale(.95)}
  .connect-btn:focus-visible{outline:2px solid rgba(10,132,255,.8);outline-offset:6px}

  .connect-btn svg{
    width:clamp(48px,13.5vmin,58px);height:clamp(48px,13.5vmin,58px);
    transition:transform .5s cubic-bezier(.34,1.56,.64,1),filter .5s,opacity .3s;
    position:relative;z-index:1;
    filter:drop-shadow(0 10px 4px rgba(102,102,102,.22));
  }
  .connect-btn .icon-veil{opacity:1}
  .connect-btn .icon-check{position:absolute;opacity:0;transform:scale(.5)}

  /* CONNECTING */
  .connecting .connect-btn{
    color:#92400e;
    background:rgba(245,158,11,.16);
    border-color:rgba(245,158,11,.42);
    box-shadow:
      0 0 40px rgba(245,158,11,.30),
      inset 2px -2px 1px -1px rgba(255,255,255,0.9),
      inset -2px 2px 1px -1px rgba(255,255,255,0.9),
      0 4px 8px rgba(0,0,0,0.10);
  }
  .connecting .connect-btn::before{
    content:'';position:absolute;inset:-5px;border-radius:50%;
    border:2px solid transparent;
    border-top-color:var(--warn);
    border-right-color:var(--warn);
    animation:spin 1s linear infinite;
  }
  .connecting .connect-btn svg{animation:iconPulse 1.2s ease-in-out infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes iconPulse{
    0%,100%{transform:scale(1);opacity:.85}
    50%{transform:scale(.92);opacity:1}
  }

  /* CONNECTED */
  .connected .connect-btn{
    color:#fff;
    background:
      radial-gradient(circle at 32% 26%,rgba(255,255,255,.55),rgba(255,255,255,.06) 62%),
      linear-gradient(145deg,rgba(16,185,129,.85),rgba(5,150,105,.75));
    border-color:rgba(255,255,255,.6);
    box-shadow:
      0 0 50px rgba(16,185,129,.45),
      0 0 100px rgba(16,185,129,.22),
      0 4px 8px rgba(0,0,0,0.12),
      inset 0 1px 0 rgba(255,255,255,.6);
  }
  .connected .connect-btn .icon-veil{opacity:0;transform:scale(.6)}
  .connected .connect-btn .icon-check{
    opacity:1;transform:scale(1);
    filter:drop-shadow(0 0 12px rgba(255,255,255,.9));
  }

  /* status text */
  .connect-status{text-align:center}
  .connect-title{
    font-size:19px;font-weight:700;letter-spacing:-.02em;
    color:var(--ink);
    transition:color .4s ease;
  }
  .connected .connect-title{color:#047857}
  .connecting .connect-title{color:#92400e}
  .connect-sub{
    margin-top:4px;font-size:11.5px;
    color:var(--ink-faint);
    font-weight:400;letter-spacing:.01em;
    min-height:16px;
    transition:color .4s ease;
  }
  .connect-sub .timer{
    color:var(--accent);font-weight:600;
    font-variant-numeric:tabular-nums;
  }

  /* ============================================================
     STATS
     ============================================================ */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  }
  .stat{
    padding:12px 10px 11px;
    border-radius:16px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:opacity .4s ease;
    position:relative;overflow:hidden;
  }
  .stat-icon{
    width:26px;height:26px;border-radius:8px;
    display:grid;place-items:center;
    background:rgba(255,255,255,.65);
    border:1px solid rgba(255,255,255,.9);
    color:var(--ink-soft);
    margin-bottom:2px;
    transition:all .4s ease;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95);
  }
  .stat-icon svg{width:13px;height:13px}
  .stat-label{
    font-size:9.5px;font-weight:500;letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .stat-value{
    font-size:14px;font-weight:700;letter-spacing:-.02em;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    transition:color .4s ease;
  }
  .stat-value small{
    font-size:9.5px;font-weight:500;
    color:var(--ink-faint);
    margin-left:1px;
  }
  .connected .stat-icon{
    color:var(--accent);
    background:rgba(10,132,255,.10);
    border-color:rgba(10,132,255,.25);
  }
  .connected .stat-value{color:var(--ink)}
  .stat.pulse{animation:statPop .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes statPop{
    0%{transform:scale(1)}
    50%{transform:scale(1.06)}
    100%{transform:scale(1)}
  }

  /* ============================================================
     SECTION
     ============================================================ */
  .section{padding:14px}
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;padding:0 4px;
  }
  .section-title{
    font-size:11px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .section-hint{
    font-size:10.5px;color:var(--ink-faint);font-weight:400;
  }
  .showall{
    font-size:10px;font-weight:600;
    color:#3e3e3e;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(255,255,255,.9);
    border-radius:999px;
    padding:4px 10px;
    cursor:pointer;
    font-family:inherit;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 3px rgba(31,38,58,.08);
    transition:all .25s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .showall:hover{background:rgba(255,255,255,.85);transform:translateY(-1px)}
  .showall:active{transform:scale(.94)}

  /* ============================================================
     SERVER LIST
     ============================================================ */
  .server-list{
    display:flex;flex-direction:column;gap:4px;
    max-height:clamp(150px,26vh,196px);overflow-y:auto;padding-right:2px;
    scrollbar-width:thin;
    scrollbar-color:rgba(35,38,46,.18) transparent;
  }
  .server-list::-webkit-scrollbar{width:4px}
  .server-list::-webkit-scrollbar-track{background:transparent}
  .server-list::-webkit-scrollbar-thumb{
    background:rgba(35,38,46,.18);border-radius:4px;
  }

  .server{
    display:flex;align-items:center;gap:11px;
    padding:10px 11px;border-radius:13px;
    border:1px solid transparent;
    cursor:pointer;background:transparent;color:inherit;
    font-family:inherit;text-align:left;width:100%;
    transition:background .25s ease,border-color .25s ease,transform .25s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .server:hover{background:rgba(255,255,255,.55)}
  .server:active{transform:scale(.985)}
  .server:focus-visible{outline:2px solid rgba(10,132,255,.7);outline-offset:1px}
  .server.active{
    background:rgba(10,132,255,.10);
    border-color:rgba(10,132,255,.35);
  }

  .server-flag{
    width:32px;height:32px;flex-shrink:0;
    border-radius:9px;display:grid;place-items:center;
    font-size:15px;line-height:1;
    background:rgba(255,255,255,.7);
    border:1px solid rgba(255,255,255,.95);
    box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 1px 3px rgba(31,38,58,.08);
  }
  .server-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .server-name{
    font-size:12.5px;font-weight:600;
    color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .server-city{
    font-size:10.5px;font-weight:400;
    color:var(--ink-faint);
  }
  .server-ping{
    display:flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;
    font-variant-numeric:tabular-nums;
    color:var(--ink-soft);
    padding:4px 9px;border-radius:999px;
    background:rgba(255,255,255,.6);
    border:1px solid rgba(255,255,255,.9);
    transition:all .3s ease;
  }
  .ping-dot{
    width:5px;height:5px;border-radius:50%;
    background:currentColor;
    box-shadow:0 0 6px currentColor;
  }
  .server-ping.good{color:#059669}
  .server-ping.medium{color:#d97706}
  .server-ping.far{color:#dc2626}
  .server.active .server-ping{
    background:rgba(10,132,255,.12);
    border-color:rgba(10,132,255,.3);
  }

  /* ============================================================
     FEATURES
     ============================================================ */
  .features{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  }
  .feature{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:11px 6px;border-radius:14px;cursor:pointer;
    background:rgba(255,255,255,.45);
    border:1px solid rgba(255,255,255,.8);
    transition:all .3s ease;
    -webkit-tap-highlight-color:transparent;
    font-family:inherit;color:inherit;
  }
  .feature:hover{background:rgba(255,255,255,.7)}
  .feature:active{transform:scale(.97)}
  .feature:focus-visible{outline:2px solid rgba(10,132,255,.7);outline-offset:2px}

  .feature-icon{
    width:28px;height:28px;border-radius:9px;
    display:grid;place-items:center;
    background:rgba(255,255,255,.7);
    border:1px solid rgba(255,255,255,.95);
    color:var(--ink-soft);
    transition:all .35s cubic-bezier(.4,0,.2,1);
  }
  .feature-icon svg{width:14px;height:14px}
  .feature-label{
    font-size:10px;font-weight:500;
    color:var(--ink-soft);
    letter-spacing:.01em;
    transition:color .3s ease;
  }
  .feature.on{background:rgba(10,132,255,.10);border-color:rgba(10,132,255,.30)}
  .feature.on .feature-icon{
    color:#fff;
    background:linear-gradient(145deg,rgba(10,132,255,.85),rgba(139,92,246,.75));
    border-color:rgba(139,92,246,.4);
    box-shadow:0 0 16px rgba(10,132,255,.35);
  }
  .feature.on .feature-label{color:var(--ink)}

  /* ============================================================
     FOOTER
     ============================================================ */
  .foot{
    text-align:center;font-size:10px;
    color:var(--ink-faint);
    letter-spacing:.06em;
    padding-top:2px;
    font-weight:400;
  }
  .foot .brand-mark{
    font-weight:700;
    background:linear-gradient(120deg,#0a84ff,#8b5cf6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  @media (max-width:380px){
    .stat-value{font-size:13px}
    .brand{font-size:16px}
    .connect-title{font-size:17.5px}
  }
  /* short windows / landscape phones — compress vertically */
  @media (max-height:660px){
    .connect-zone{padding:8px 0 0;gap:10px}
    .stat{padding:9px 8px 8px}
    .section{padding:11px}
  }
  @media (max-height:520px){
    .app{gap:8px}
    .header{padding:0}
    .stats{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;
      animation-iteration-count:1!important;
      transition-duration:.01ms!important;
    }
  }

  /* ============ modal / gate / toast / rtl ============ */
  .overlay{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(226,232,240,.55);backdrop-filter:blur(8px) saturate(140%);-webkit-backdrop-filter:blur(8px) saturate(140%)}
  .overlay.show{display:flex}
  @media(min-width:480px){.overlay{align-items:center}}
  .sheet{width:100%;max-width:400px;max-height:86vh;overflow-y:auto;padding:20px 18px 24px;border-radius:22px 22px 0 0;animation:sheetUp .45s cubic-bezier(.22,1,.36,1)}
  @media(min-width:480px){.sheet{border-radius:22px}}
  @keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet h3{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px;color:var(--ink)}
  .sheet .sub{font-size:11.5px;color:var(--ink-faint);margin-bottom:14px}
  .field{display:flex;gap:8px;margin:10px 0}
  .field input,.field select{flex:1;min-width:0;padding:11px 13px;border-radius:13px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.72);color:var(--ink);font-family:inherit;font-size:13px;outline:none;transition:border-color .3s;box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 1px 4px rgba(31,38,58,.06)}
  .field input:focus,.field select:focus{border-color:rgba(10,132,255,.55)}
  .field input::placeholder{color:var(--ink-faint)}
  .field select option{background:#fff;color:var(--ink)}
  .btn{padding:12px 16px;border-radius:13px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.65);color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:all .3s;-webkit-tap-highlight-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 2px 6px rgba(31,38,58,.07)}
  .btn:hover{background:rgba(255,255,255,.9)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(145deg,#3e3e3e,#23262e);border-color:rgba(255,255,255,.25);color:#fff;box-shadow:0 4px 14px rgba(35,38,46,.35),inset 0 1px 0 rgba(255,255,255,.28)}
  .btn.danger{border-color:rgba(239,68,68,.4);color:#dc2626}
  .btn.wide{width:100%;margin-top:6px}
  .lic-badge{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);margin:10px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.95)}
  .lic-badge .t{font-size:12.5px;font-weight:700;color:var(--ink)}
  .lic-badge .d{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
  .lic-badge .tag{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.05em;background:rgba(10,132,255,.12);border:1px solid rgba(10,132,255,.35);color:#0a84ff}
  .lic-badge .tag.pre{background:rgba(139,92,246,.14);border-color:rgba(139,92,246,.4);color:#7c3aed}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid rgba(35,38,46,.08)}
  .row:last-child{border-bottom:0}
  .row .k{font-size:12.5px;color:var(--ink);font-weight:500}
  .row .v{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .ip-line{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--ink-soft)}
  .ip-line b{color:var(--accent);font-weight:600}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:99;padding:11px 18px;border-radius:14px;background:rgba(35,38,46,.94);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:12px;font-weight:500;opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.22,1,.36,1);max-width:86vw;text-align:center;box-shadow:0 8px 32px rgba(31,38,58,.4)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:rgba(248,113,113,.5);color:#fecaca}
  .gate-warn{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);margin-bottom:12px}
  .gate-warn svg{width:17px;height:17px;flex-shrink:0;color:#d97706;margin-top:1px}
  .gate-warn p{font-size:11.5px;line-height:1.55;color:#92400e}
  .mini-links{display:flex;gap:8px;margin-top:12px}
  html[dir="rtl"] .header,html[dir="rtl"] .section-head,html[dir="rtl"] .row{flex-direction:row-reverse}
  html[dir="rtl"] .server{flex-direction:row-reverse;text-align:right}
  html[dir="rtl"] .brand,html[dir="rtl"] .status-pill,html[dir="rtl"] .server-ping{flex-direction:row-reverse}
  html[dir="rtl"] .stats{direction:ltr}
  html[dir="rtl"] .sheet{text-align:right}
  .ver{opacity:.75}
  .spin-load{display:inline-block;width:13px;height:13px;border:2px solid rgba(35,38,46,.22);border-top-color:#0a84ff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
</style>
</head>
<body>
  <div class="bg">
    <div class="bg-gradient"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="bg-noise"></div>
  </div>

  <main class="app" id="app">
    <header class="header">
      <div class="brand">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C7 2 3 6 3 11c0 5 4 9 9 11 5-2 9-6 9-11 0-5-4-9-9-9z" opacity=".35"/>
            <path d="M12 5c-3.5 0-6.5 3-6.5 7 0 3.8 3 6.9 6.5 8.2 3.5-1.3 6.5-4.4 6.5-8.2 0-4-3-7-6.5-7z" opacity=".6"/>
            <path d="M12 8.5c-1.9 0-3.5 1.6-3.5 3.6 0 2 1.6 3.6 3.5 4.4 1.9-.8 3.5-2.4 3.5-4.4 0-2-1.6-3.6-3.5-3.6z"/>
          </svg>
        </span>
        <span>Veil</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="status-pill" id="statusPill">
          <span class="status-dot"></span>
          <span id="statusText">Disconnected</span>
        </div>
        <button class="btn" id="settingsBtn" style="padding:8px 10px;border-radius:12px" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <section class="connect-zone" id="connectZone">
      <div class="connect-wrap">
        <span class="ring ring1"></span>
        <span class="ring ring2"></span>
        <span class="ring ring3"></span>
        <button class="connect-btn" id="connectBtn" aria-label="Connect">
          <svg class="icon-veil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C7 2 3 6 3 11c0 5 4 9 9 11 5-2 9-6 9-11 0-5-4-9-9-9z" opacity=".35"/>
            <path d="M12 5c-3.5 0-6.5 3-6.5 7 0 3.8 3 6.9 6.5 8.2 3.5-1.3 6.5-4.4 6.5-8.2 0-4-3-7-6.5-7z" opacity=".6"/>
            <path d="M12 8.5c-1.9 0-3.5 1.6-3.5 3.6 0 2 1.6 3.6 3.5 4.4 1.9-.8 3.5-2.4 3.5-4.4 0-2-1.6-3.6-3.5-3.6z"/>
          </svg>
          <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C7 2 3 6 3 11c0 5 4 9 9 11 5-2 9-6 9-11 0-5-4-9-9-9z" opacity=".45"/>
            <polyline points="8.5 12 11 14.5 15.5 9.5"/>
          </svg>
        </button>
      </div>
      <div class="connect-status">
        <div class="connect-title" id="connectTitle">Tap to connect</div>
        <div class="connect-sub" id="connectSub">See nothing. Be invisible.</div>
        <div class="ip-line" id="ipLine" style="display:none"><span id="ipText"></span></div>
      </div>
    </section>

    <div class="stats">
      <div class="stat glass" id="statPing">
        <span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
        <span class="stat-label" data-i18n="ping">Ping</span>
        <span class="stat-value" data-key="ping">--<small>ms</small></span>
      </div>
      <div class="stat glass" id="statDown">
        <span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></span>
        <span class="stat-label" data-i18n="down">Down</span>
        <span class="stat-value" data-key="down">--<small>Mb</small></span>
      </div>
      <div class="stat glass" id="statUp">
        <span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></span>
        <span class="stat-label" data-i18n="up">Up</span>
        <span class="stat-value" data-key="up">--<small>Mb</small></span>
      </div>
    </div>

    <section class="section glass">
      <div class="section-head">
        <span class="section-title" data-i18n="servers">Servers</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span class="section-hint" id="serverHint">···</span>
          <button class="showall" id="showAllBtn" style="display:none">Show all</button>
        </span>
      </div>
      <div class="server-list" id="serverList"></div>
    </section>

    <section class="section glass">
      <div class="section-head"><span class="section-title" data-i18n="features">Features</span></div>
      <div class="features">
        <button class="feature on" data-feature="kill">
          <span class="feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="4" y1="4" x2="20" y2="20"/></svg></span>
          <span class="feature-label" data-i18n="f_kill">Kill Switch</span>
        </button>
        <button class="feature on" data-feature="auto">
          <span class="feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
          <span class="feature-label" data-i18n="f_auto">Auto-Connect</span>
        </button>
        <button class="feature" data-feature="adblock">
          <span class="feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg></span>
          <span class="feature-label" data-i18n="f_ad">Ad Blocker</span>
        </button>
      </div>
    </section>

    <p class="foot"><span class="brand-mark">MEHR</span> · AES-256 · Zero-Log · <span class="ver" id="verMark">v1.6.12</span></p>
  </main>

  <!-- SETTINGS -->
  <div class="overlay" id="settingsOverlay">
    <div class="sheet glass">
      <h3 data-i18n="settings">Settings</h3>
      <div class="row"><span class="k" data-i18n="language">Language</span></div>
      <div class="field"><select id="langSel"></select></div>
      <div class="row"><span class="k" data-i18n="custom_source">Custom subscription</span><span class="v" id="srcState"></span></div>
      <div class="field"><input id="srcInput" type="url" placeholder="https://... (sub or raw list)"></div>
      <button class="btn wide" id="srcSave" data-i18n="save_refresh">Save & refresh servers</button>
      <button class="btn wide" id="refreshServers" data-i18n="refresh_now">Refresh servers now</button>
      <button class="btn wide" id="setClose" style="background:transparent;margin-top:10px" data-i18n="close">Close</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
