name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Setup tools
        run: bash scripts/setup_tools.sh
      - name: Build APK
        run: |
          mkdir -p dist
          sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip >/dev/null
          OUT_DIR=dist bash scripts/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mehrveil-Android
          path: dist/Mehrveil-1.6.8.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-rs
      - name: Build EXE (Rust core + WebView2 UI, MSVC)
        shell: bash
        run: |
          mkdir -p dist
          OUT_DIR=dist bash scripts/build_exe.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mehrveil-Windows
          path: dist/Mehrveil-1.6.8.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ android, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/Mehrveil-*
